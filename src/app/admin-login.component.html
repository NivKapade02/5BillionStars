<div class="login-shell">
  <div class="login-panel">
    <div class="brand-block">
      <span class="brand-badge">5B</span>
      <div>
        <p class="eyebrow">Admin Portal</p>
        <h1>5 Billion Stars</h1>
      </div>
    </div>

    <h2>Secure Sign In</h2>
    <p class="subtitle">Manage booking requests and stay connected with your guests.</p>

    <form (ngSubmit)="submit()">
      <label>
        <span>Email</span>
        <input type="email" [(ngModel)]="email" name="email" placeholder="admin@5billionstars.com" required />
      </label>

      <label>
        <span>Password</span>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Enter password" required />
      </label>

      <button type="submit">Login to Dashboard</button>
    </form>

    <div class="demo-note" *ngIf="!errorMessage">
      Use your designated Firebase admin email and password.
    </div>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
  </div>
</div>
